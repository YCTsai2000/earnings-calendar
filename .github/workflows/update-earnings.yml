name: Update Earnings Calendar

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00（台灣時間早上8點）
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "generate_earnings_calendar.py"
      - "watchlist.txt"   # 改觀察名單時也會自動觸發重新產生

permissions:
  contents: write

jobs:
  update-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate earnings calendar
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python3 generate_earnings_calendar.py --days-ahead 45

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/earnings.ics
          git diff --staged --quiet || git commit -m "Auto-update earnings calendar $(date -u +%Y-%m-%d)"
          git push
