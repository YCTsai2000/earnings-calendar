name: Update Earnings Calendar

on:
  schedule:
    # UTC 00:00 = 台灣時間 08:00
    - cron: "0 0 * * *"

  # 可以在 GitHub Actions 手動執行
  workflow_dispatch: {}

  # 修改程式或觀察名單時自動更新
  push:
    branches:
      - main

    paths:
      - "generate_earnings_calendar.py"
      - "watchlist.txt"

permissions:
  contents: write

jobs:

  update-ics:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repo
        uses: actions/checkout@v6

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ------------------------------------------------------
      # Generate ICS
      # ------------------------------------------------------

      - name: Generate earnings calendar
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

        run: |
          python3 generate_earnings_calendar.py \
            --days-ahead 45 \
            --alarm-hours-before 28

      # ------------------------------------------------------
      # Commit & Push
      # ------------------------------------------------------

      - name: Commit and push if changed
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add docs/earnings.ics

          if git diff --staged --quiet; then

            echo "沒有變更，不需要 commit"

          else

            git commit \
              -m "Auto-update earnings calendar $(date -u +%Y-%m-%d)"

            git push

          fi
